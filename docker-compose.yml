services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mealmate
      POSTGRES_PASSWORD: mealmate_local
      POSTGRES_DB: mealmate
    volumes:
      - mealmate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealmate"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mealmate_pgdata:
